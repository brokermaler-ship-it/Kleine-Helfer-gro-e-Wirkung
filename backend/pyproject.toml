[project]
name = "voice-tutor"
version = "0.1.0"
description = "Prototyp des internen Voice-AI-Tutors"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[deepgram,cartesia,silero,anthropic,turn-detector]~=1.8",
    "livekit-api~=1.2",
    "anthropic~=1.15",
    "fastapi~=0.148",
    "uvicorn[standard]>=0.30",
    "pyyaml~=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["tutor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
